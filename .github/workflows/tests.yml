name: Tests

# For most extensions, this workflow should not need changing;
# simply commit it to your repository.
#
# See the README for full details and configuration instructions:
#  - https://github.com/phpbb-extensions/test-framework
#
on:
  push:
    # Run tests when commits are pushed to these branches in your repo,
    # or remove this branches section to run tests on all your branches
    branches:
      - main

  pull_request:
    # Run tests when pull requests are made on these branches in your repo,
    # or remove this branches section to run tests on all your branches
    branches:
      - main

jobs:
  # phpBB 3.3.x compatibility
  call-tests-3-3-x:
    name: Extension tests (phpBB 3.3.x)
    uses: phpbb-extensions/test-framework/.github/workflows/tests.yml@3.3.x
    with:
      EXTNAME: phpbbmodders/groupwarn
      # EPV runs in the epv job below instead
      EPV: 0
      PHPBB_BRANCH: '3.3.x'
      RUN_MYSQL_JOBS: 0
      RUN_PGSQL_JOBS: 0
      RUN_MSSQL_JOBS: 0
      RUN_WINDOWS_JOBS: 0
      PRIMARY_PHP_VERSION: '8.3'
      PHP_VERSION_MATRIX: '["8.1", "8.3", "8.4"]'

  # phpBB 4.0 (master) compatibility; phpBB 4.0 itself needs PHP 8.2 or later
  call-tests-master:
    name: Extension tests (phpBB master / 4.0)
    uses: phpbb-extensions/test-framework/.github/workflows/tests.yml@master
    with:
      EXTNAME: phpbbmodders/groupwarn
      # EPV runs in the epv job below instead
      EPV: 0
      PHPBB_BRANCH: 'master'
      RUN_MYSQL_JOBS: 0
      RUN_PGSQL_JOBS: 0
      RUN_MSSQL_JOBS: 0
      RUN_WINDOWS_JOBS: 0
      PRIMARY_PHP_VERSION: '8.3'
      PHP_VERSION_MATRIX: '["8.3", "8.4"]'

  # EPV (Extension Pre Validator), failing on any Fatal or Error finding not
  # listed in .github/epv-allowed.txt
  epv:
    uses: phpbbmodders/.github/.github/workflows/epv.yml@v1
    with:
      EXTNAME: phpbbmodders/groupwarn
      PHPBB_BRANCHES: '["3.3.x", "master"]'
